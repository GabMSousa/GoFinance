{% load static %}
<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar · SaaS Finance</title><link rel="stylesheet" href="{% static 'finance/css/app.css' %}"></head>
<body class="login-page"><main class="login-card"><div class="brand justify-content-center mb-5"><span class="brand-mark">SF</span><span>SaaS Finance</span></div><h1>Bem-vindo de volta</h1><p class="login-intro">Entre para acompanhar o seu mês com clareza.</p><form method="post">{% csrf_token %}{% if form.non_field_errors %}<div class="alert alert-danger">Usuário ou senha inválidos.</div>{% endif %}<div class="field-group"><label for="id_username">Usuário</label>{{ form.username }}</div><div class="field-group"><label for="id_password">Senha</label>{{ form.password }}</div><button class="btn btn-primary w-100 mt-3" type="submit">Entrar no painel</button></form></main></body></html>

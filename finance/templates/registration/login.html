{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GoFinance</title>
  <link rel="icon" href="{% static 'finance/img/gofinance-cat.png' %}?v=20261018-cat-5" type="image/png">
  <link rel="stylesheet" href="{% static 'finance/css/app.css' %}?v=20261018-login-cat-1">
</head>
<body class="login-page login-page--minimal">
  <main class="login-card login-card--minimal">
    <div class="login-brand"><img class="brand-mark" src="{% static 'finance/img/gofinance-cat.png' %}?v=20261018-cat-5" alt="Ícone do gato do GoFinance"><span>GoFinance</span></div>
    <h1>Bem-vindo de volta</h1>
    <p class="login-intro">Entre para acompanhar o seu mês com clareza.</p>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="alert alert-danger">Usuário ou senha inválidos.</div>{% endif %}
      <div class="field-group login-field"><label for="id_username">Usuário</label>{{ form.username }}</div>
      <div class="field-group login-field"><label for="id_password">Senha</label>{{ form.password }}</div>
      <button class="btn btn-primary login-submit w-100 mt-3" type="submit">Entrar no painel</button>
    </form>
  </main>
</body>
</html>

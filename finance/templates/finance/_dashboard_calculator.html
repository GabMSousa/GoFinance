{% load static %}
<aside class="dashboard-calculator" data-dashboard-calculator data-darkreader-ignore aria-label="Calculadora rápida">
  <div class="dashboard-calculator-panel" id="dashboard-calculator-panel" data-calculator-panel>
    <output class="dashboard-calculator-display" data-calculator-display aria-live="polite">0</output>
    <div class="dashboard-calculator-keys">
      <button class="dashboard-calculator-key dashboard-calculator-key--function" type="button" data-calculator-key="clear">AC</button>
      <button class="dashboard-calculator-key dashboard-calculator-key--function" type="button" data-calculator-key="sign">+/-</button>
      <button class="dashboard-calculator-key dashboard-calculator-key--function" type="button" data-calculator-key="percent">%</button>
      <button class="dashboard-calculator-key dashboard-calculator-key--operator" type="button" data-calculator-key="operator" data-value="÷">÷</button>
      <button class="dashboard-calculator-key" type="button" data-calculator-key="digit" data-value="7">7</button>
      <button class="dashboard-calculator-key" type="button" data-calculator-key="digit" data-value="8">8</button>
      <button class="dashboard-calculator-key" type="button" data-calculator-key="digit" data-value="9">9</button>
      <button class="dashboard-calculator-key dashboard-calculator-key--operator" type="button" data-calculator-key="operator" data-value="×">×</button>
      <button class="dashboard-calculator-key" type="button" data-calculator-key="digit" data-value="4">4</button>
      <button class="dashboard-calculator-key" type="button" data-calculator-key="digit" data-value="5">5</button>
      <button class="dashboard-calculator-key" type="button" data-calculator-key="digit" data-value="6">6</button>
      <button class="dashboard-calculator-key dashboard-calculator-key--operator" type="button" data-calculator-key="operator" data-value="−">−</button>
      <button class="dashboard-calculator-key" type="button" data-calculator-key="digit" data-value="1">1</button>
      <button class="dashboard-calculator-key" type="button" data-calculator-key="digit" data-value="2">2</button>
      <button class="dashboard-calculator-key" type="button" data-calculator-key="digit" data-value="3">3</button>
      <button class="dashboard-calculator-key dashboard-calculator-key--operator" type="button" data-calculator-key="operator" data-value="+">+</button>
      <button class="dashboard-calculator-key dashboard-calculator-key--wide" type="button" data-calculator-key="digit" data-value="0">0</button>
      <button class="dashboard-calculator-key" type="button" data-calculator-key="decimal" data-value=",">,</button>
      <button class="dashboard-calculator-key dashboard-calculator-key--operator dashboard-calculator-key--equals" type="button" data-calculator-key="equals">=</button>
    </div>
  </div>
  <button class="dashboard-calculator-tab" type="button" data-calculator-toggle aria-expanded="false" aria-controls="dashboard-calculator-panel" aria-label="Abrir calculadora">
    <img src="{% static 'finance/img/calculator-money.svg' %}?v=20261018-1" alt="">
  </button>
</aside>

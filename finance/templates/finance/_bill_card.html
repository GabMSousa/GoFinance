<section class="bill-card {% if bill and bill.is_paid %}bill-paid{% endif %}"><div class="bill-summary"><p class="summary-label">Fatura do cartão · {{ month_name }}</p><strong class="bill-value">R$ {{ summary.card_invoice|floatformat:2 }}</strong>{% if bill and bill.is_paid %}<div class="bill-state">✓ Paga</div><small>Pago em {{ bill.paid_at|date:'d/m/Y' }}</small>{% else %}<div class="bill-state bill-pending">Pendente</div>{% endif %}</div><div class="bill-actions">{% if bill and bill.is_paid %}<form method="post" action="{% url 'finance:undo_bill_payment' %}" onsubmit="return confirm('Desfazer o pagamento desta fatura?');">{% csrf_token %}<button class="btn btn-sm btn-link" type="submit">Desfazer pagamento</button></form>{% else %}<button class="btn btn-outline-dark" type="button" data-bs-toggle="modal" data-bs-target="#billModal">Pagar fatura</button><button class="btn btn-sm btn-link" type="button" data-bs-toggle="modal" data-bs-target="#csvModal">Importar CSV</button>{% endif %}<a class="btn btn-sm btn-link" href="{% url 'finance:monthly_report' %}?year={{ year }}&month={{ month }}">Relatórios</a></div></section>
